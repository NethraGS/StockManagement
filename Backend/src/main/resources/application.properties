# ============================================
# WealthPulse Backend \u2014 Application Properties
# ============================================

server.port=8080

# Twelve Data \u2014 Free tier (800 req/day)
# Sign up: https://twelvedata.com
twelvedata.api.key=YOUR_TWELVEDATA_API_KEY
twelvedata.base.url=https://api.twelvedata.com

# Finnhub \u2014 Free tier
# Sign up: https://finnhub.io
finnhub.api.key=YOUR_FINNHUB_API_KEY
finnhub.base.url=https://finnhub.io/api/v1

# NewsAPI.org \u2014 Free tier (100 req/day)
# Sign up: https://newsapi.org/register
news.api.key=YOUR_NEWSAPI_KEY
news.api.base-url=https://newsapi.org/v2

# \u2500\u2500 MySQL Database \u2500\u2500
spring.datasource.url=jdbc:mysql://mysql:3306/wealthpulse
# ── MySQL Database ──
spring.datasource.url=jdbc:mysql://localhost:3306/wealthpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable SQL logging for debugging
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.jdbc=DEBUG

# \u2500\u2500 JWT \u2500\u2500
jwt.secret=WealthPulse2026SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!!
jwt.expiration-ms=86400000

# CORS — allow Vite dev server
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8081,http://100.53.25.60:8080

