# ============================================
# WealthPulse Backend — Application Properties
# ============================================

server.port=8080

# Twelve Data — Free tier (800 req/day)
# Sign up: https://twelvedata.com
twelvedata.api.key=YOUR_TWELVEDATA_API_KEY
twelvedata.base.url=https://api.twelvedata.com

# Finnhub — Free tier
# Sign up: https://finnhub.io
finnhub.api.key=YOUR_FINNHUB_API_KEY
finnhub.base.url=https://finnhub.io/api/v1

# NewsAPI.org — Free tier (100 req/day)
# Sign up: https://newsapi.org/register
news.api.key=YOUR_NEWSAPI_KEY
news.api.base-url=https://newsapi.org/v2

# ── H2 Database (file-based, persists across restarts) ──
spring.datasource.url=jdbc:h2:file:./data/wealthpulse
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=shobit
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ──
jwt.secret=WealthPulse2026SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!!
jwt.expiration-ms=86400000

# CORS — allow Vite dev server
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8081

